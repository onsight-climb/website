        <header id="static-home"><p>OnSight Climbing · Concept illustration.</p><h1>See your climbing journey more clearly.</h1><p>Explore how OnSight connects route discovery, climb logging and session history, with route tools for gym teams.</p><p><a href="#static-app">Explore the app ↓</a> · <a href="#static-gyms">Explore the staff workflow</a> · <a href="#static-vision">See the vision</a></p><h2>A route, over time</h2><p>One climb, three moments: find a route, record the climb, and revisit the session. A route is more than a moment on the wall.</p><p class="preview-label">Product preview · availability unverified.</p><ul><li><a href="#static-app">Climber journey: find a route and keep the memory</a></li><li><a href="#static-gyms">Gym teams: make the wall easier to manage</a></li><li><a href="#static-vision">Our direction: more context for every climb</a></li></ul></header>
        <section id="static-app"><h2>From the wall to your climbing record.</h2><p>Follow a route from discovery to a record you can revisit.</p><p class="preview-label">Product preview · availability unverified. Concept illustration.</p><ol><li><b>Find:</b> Choose a gym and discover a route, including a QR path.</li><li><b>Log:</b> Record an ascent as part of a session.</li><li><b>Revisit:</b> Look back at sessions and climbing history.</li></ol><h3>Before you climb</h3><p>Start with a route to explore. The product work includes gym and route discovery, with a QR path.</p><h3>During your session</h3><p>Keep a record of the climb. An ascent can be recorded as part of a session.</p><h3>After the session</h3><p>Return to your session and climbing history. Complete lifecycle behavior and availability have not been verified.</p><p><a href="#static-gyms">See the staff workflow →</a></p></section>
        <section id="static-gyms"><h2>For climbing teams</h2><h3>A clearer view of the wall for your team.</h3><p>Explore a staff workflow for route inventory, finding a route, and creating or editing route details.</p><p>Staff route inventory and editing are visible in the product work. Release readiness and access are still being verified.</p><p class="preview-label">Product preview · availability unverified. Concept illustration.</p><h3>From route list to route record</h3><ol><li>Inventory</li><li>Find a route</li><li>Create or edit</li></ol><p>Staff route tools are under development. Release readiness and access are still being verified.</p><h3>Climbers and gym teams share context</h3><p>Route details connect a gym team's workflow with a climber's route discovery. The connected experience is a product direction, not a verified live integration.</p><p class="preview-label">Product preview · availability unverified.</p><p><a href="#static-app">See the climber journey →</a> · <a href="#static-home">Back to home ↑</a></p></section>
        <section id="static-vision"><h2>Better context for every climb.</h2><p>Our vision is to help climbers remember their progress and help gyms keep their wall information useful.</p><p>Possible directions are ideas to assess, not committed features.</p><h3>Exploring next</h3><p>Possible directions include smoother gym workflows and richer climbing context. These are ideas to assess, not committed features.</p><h3>Guiding principles</h3><p>Useful at the wall. Clear after the session. We are exploring ways to keep route information useful to gym teams and make a climber's record easier to revisit. These ideas need product validation before they become commitments.</p><p class="preview-label">Ideas, not commitments.</p><a href="#static-app">Return to the app story ↑</a></section>
